name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string

      dotnet-version:
        required: false
        type: string
        default: '9.0.x'
      build-configuration:
        required: false
        type: string
        default: 'Release'  
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true  

jobs:
  build-and-test:
    name: Build and Test
    runs-on: 
      - self-hosted
      - Windows
      - X64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4      
      - name: Verify .NET
        run: |
          dotnet --version
          dotnet --info
      - name: Begin SonarQube analysis
        shell: powershell
        run: |
          dotnet sonarscanner begin `
            /k:"Member-Claims-Platform" `
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
            /d:sonar.qualitygate.wait=true    

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution }}

      - name: Build application
        run: dotnet build ${{ inputs.solution }} --configuration ${{ inputs.build-configuration }} --no-restore

      - name: Run tests with code coverage
        run: >
          dotnet test ${{ inputs.solution }}
          --configuration ${{ inputs.build-configuration }}
          --no-build
          --collect:"XPlat Code Coverage;Format=opencover"
          --logger "trx;LogFileName=test-results.trx"
      - name: End SonarQube analysis
        shell: powershell
        run: |
          dotnet sonarscanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.opencover.xml