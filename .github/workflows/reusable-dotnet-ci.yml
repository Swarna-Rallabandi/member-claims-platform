name: Reusable .NET CI

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string

      dotnet-version:
        required: false
        type: string
        default: '9.0.x'
      build-configuration:
        required: false
        type: string
        default: 'Release'  
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.solution }}

      - name: Build application
        run: dotnet build ${{ inputs.solution }} --configuration ${{ inputs.build-configuration }} --no-restore

      - name: Run tests
        run: >
          dotnet test ${{ inputs.solution }}
          --configuration ${{ inputs.build-configuration }}
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml